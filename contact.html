<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <header class="top_and_bottom_background">
        <div>
            <a href="index.html">Accueil</a>
            <a href="contact.html">Contact</a>
            <a href="cv.html">CV</a>
            <a href="realisations.html">Realisations</a>
        </div>
    </header>

    <main class="main_background">
        <form method ="POST" action="#">
            <fieldset>
                <legend>Identité *</legend>
                <label for="lastname">Nom</label>
                <input type="text" name="lastname" id="lastname" placeholder="Dupont" 
                minlength="2" maxlength="40" required>

                <br>

                <label for="firstname">Prénom</label>
                <input type="text" name="firstname" id="firstname" placeholder="Jean" required>

                <br>

                <label for="email">Adresse Email</label>
                <input type="email" name="email" id="email" placeholder="dupontjean@domain.fr" required>
            </fieldset>

            <fieldset>   
                <legend>Message *</legend>
                <label for="object">Objet</label>
                <select name="object" id="object" required>
                    <option value="demande_informations">Demande d'informations</option>
                    <option value="recrutement">Votre profil nous interesse</option>
                    <option value="autre">Demande autres</option>
                </select>

                <br>

                <label for="message">Message :</label>
                <textarea name="message" id="message" rows="5" cols="50" minlength="20"></textarea>
            </fieldset>

            <fieldset>
                <legend>Consentement *</legend>
                <label for="reglement">J'accepte l'utilisation des données renseignés.</label>
                <input class="regular_text" type="checkbox" name="reglement" value="reglement" required>
            </fieldset>

            <div style="text-align: center;">
                <button type="submit">Envoyer</button> 
                <button type="reset">Supprimer</button>
            </div>   
        </form>
    </main>

    <footer class="top_and_bottom_background">
        <div class="flexbox">
            <p class="header_text">Disponible sur LinkedIn</p>
            <img class="logo" src="img/LinkedIn.png" alt="LinkedIn">
        </div>
        <p class="header_text" style ="text-align: right;">Tel : 07 49 99 02 88 </p>
        <p class="header_text">Mail : ledivenahleandre@gmail.com</p>
    </footer>
</body>
</html>
